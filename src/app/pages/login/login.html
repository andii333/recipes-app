<div class="container">
  <form class="container__form form" (ngSubmit)="onSubmit()">
    <header class="container__header">
      <picture class="container__picture">
        <img
          class="container__icon"
          src="icons/recipe-manager.svg"
          alt="recipe icon"
        />
      </picture>
      <h1 class="container__title">Recipe Manager</h1>
      <p class="container__subtitle">Sign in to manage your recipes</p>
    </header>
    <div class="form__group">
      <label class="form__label" for="username">Username</label>
      <input
        #usernameInput
        pInputText
        class="form__input"
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        [(ngModel)]="username"
        [pTooltip]="!username && isSubmitted ? 'field cannot be empty' : ''"
        tooltipPosition="bottom"
        tooltipEvent="focus"
        required
      />
    </div>
    <div class="form__group">
      <label class="form__label" for="password">Password</label>
      <input
        #passwordInput
        pInputText
        class="form__input"
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        [(ngModel)]="password"
        [pTooltip]="!password && isSubmitted ? 'field cannot be empty' : ''"
        tooltipPosition="bottom"
        tooltipEvent="focus"
        required
      />
      <span></span>
    </div>
    <p-button
      class="form__btn"
      type="submit"
      label="Sign In"
      severity="contrast"
    ></p-button>
  </form>
</div>
